# WOMS schema, generated by generate.py from WOMS-functional-spec.md (sections 9.6 and 9.7).
# Every entity also has: id (opaque string primary key), created_at, updated_at, created_by.
# status: built = exists in the reference application; proposed = specified only (billing, mobile, planned features).
entities:
  Aisles:
    status: built
    fields:
      name: { type: string, size: 200, required: true }
      zone_id: { type: ref, references: Zones, required: true, on_delete: cascade, notes: "cascade delete" }
  AppUsers:
    status: built
    fields:
      business_role: { type: string, size: 50, required: true }
      account_id: { type: string, size: 100, required: true, unique: true }
      email: { type: string, size: 200, required: true, unique: true }
      user_status: { type: string, size: 30, required: true, default: "Active", notes: "default `Active`" }
      warehouse_id: { type: ref, references: Warehouses, on_delete: set_null, notes: "set null on delete" }
  AuditLog:
    status: built
    fields:
      action_type: { type: string, size: 100, required: true }
      details: { type: text }
      event_timestamp: { type: datetime }
      module: { type: string, size: 100, required: true }
      record_id: { type: string, size: 100 }
      user_id: { type: string, size: 100 }
  Cargo:
    status: built
    fields:
      current_location_id: { type: ref, references: StorageLocations, on_delete: set_null, notes: "set null on delete" }
      customer_id: { type: ref, references: Customers, required: true, on_delete: cascade, notes: "cascade delete" }
      description: { type: text }
      dimensions: { type: string, size: 100 }
      height_cm: { type: decimal, size: 4 }
      inbound_advice_id: { type: ref, references: InboundAdvice, on_delete: cascade, notes: "cascade delete" }
      length_cm: { type: decimal, size: 4 }
      outer_package_no: { type: string, size: 20 }
      qr_code: { type: string, size: 100, unique: true }
      qty: { type: integer }
      received_qty: { type: decimal, size: 4 }
      reserved_location_id: { type: ref, references: StorageLocations, on_delete: set_null, notes: "set null on delete" }
      status: { type: string, size: 30, required: true, default: "Received", notes: "default `Received`" }
      unit: { type: string, size: 30 }
      warehouse_id: { type: ref, references: Warehouses, on_delete: set_null, notes: "set null on delete" }
      weight: { type: decimal, size: 4 }
      width_cm: { type: decimal, size: 4 }
  CargoMovementLog:
    status: built
    fields:
      cargo_id: { type: ref, references: Cargo, required: true, on_delete: cascade, notes: "cascade delete" }
      from_location_id: { type: ref, references: StorageLocations, on_delete: set_null, notes: "set null on delete" }
      moved_by: { type: string, size: 100 }
      movement_timestamp: { type: datetime }
      movement_type: { type: string, size: 30, required: true }
      to_location_id: { type: ref, references: StorageLocations, on_delete: set_null, notes: "set null on delete" }
  Contacts:
    status: built
    fields:
      customer_id: { type: ref, references: Customers, required: true, on_delete: cascade, notes: "cascade delete" }
      email: { type: string, size: 200 }
      first_name: { type: string, size: 100, required: true }
      is_primary: { type: boolean, required: true, default: "false", notes: "default `false`" }
      last_name: { type: string, size: 100, required: true }
      phone: { type: string, size: 50 }
      salutation: { type: string, size: 10 }
  Customers:
    status: built
    fields:
      address: { type: text }
      contact_person: { type: string, size: 200 }
      email: { type: string, size: 200 }
      name: { type: string, size: 200, required: true, unique: true }
      operational_preferences: { type: text }
      phone: { type: string, size: 50 }
      status: { type: string, size: 30, required: true, default: "Active", notes: "default `Active`" }
  Dispatch:
    status: built
    fields:
      confirmation_document_id: { type: string, size: 200 }
      dispatch_date: { type: datetime }
      dispatched_by: { type: string, size: 100 }
      outbound_request_id: { type: ref, references: OutboundRequest, required: true, on_delete: cascade, notes: "cascade delete" }
      status: { type: string, size: 30, required: true, default: "Pending", notes: "default `Pending`" }
      vehicle_details: { type: text }
  Documents:
    status: built
    fields:
      doc_type: { type: string, size: 100, required: true }
      file_id: { type: string, size: 200 }
      linked_module: { type: string, size: 100, required: true }
      linked_record_id: { type: string, size: 100, required: true }
      uploaded_by: { type: string, size: 100 }
      uploaded_date: { type: datetime }
  GRN:
    status: built
    fields:
      document_id: { type: string, size: 200 }
      generated_date: { type: datetime }
      grn_number: { type: string, size: 100, required: true, unique: true }
      inbound_advice_id: { type: ref, references: InboundAdvice, required: true, on_delete: cascade, notes: "cascade delete" }
      status: { type: string, size: 30, required: true, default: "Pending", notes: "default `Pending`" }
      verified_by: { type: string, size: 100 }
  HuLine:
    status: built
    fields:
      cargo_id: { type: ref, references: Cargo, required: true, on_delete: cascade, notes: "cascade delete" }
      inbound_line_id: { type: ref, references: InboundLine, required: true, on_delete: cascade, notes: "cascade delete" }
      qty: { type: decimal, size: 4 }
  InboundAdvice:
    status: built
    fields:
      adr_status: { type: string, size: 10 }
      cmr_number: { type: string, size: 50 }
      customer_id: { type: ref, references: Customers, on_delete: cascade, notes: "cascade delete" }
      destination: { type: string, size: 150 }
      driver_name: { type: string, size: 100 }
      expected_colli: { type: integer }
      expected_date: { type: date }
      inbound_reference: { type: string, size: 30, unique: true }
      license_plate: { type: string, size: 30 }
      received_piece_count: { type: integer }
      reference_client: { type: string, size: 100 }
      reference_number: { type: string, size: 100 }
      rejection_reason: { type: text }
      remarks: { type: text }
      status: { type: string, size: 30, required: true, default: "Submitted", notes: "default `Submitted`" }
      storage_end_date: { type: date }
      storage_start_date: { type: date }
      supplier_id: { type: ref, references: Suppliers, on_delete: set_null, notes: "set null on delete" }
      transport_details: { type: text }
      transport_type: { type: string, size: 50 }
      transporter_id: { type: ref, references: Transporters, on_delete: set_null, notes: "set null on delete" }
      warehouse_id: { type: ref, references: Warehouses, on_delete: set_null, notes: "set null on delete" }
      warehouse_unloading_date: { type: date }
      warehouse_unloading_time: { type: string, size: 10 }
  InboundLine:
    status: built
    fields:
      customer_id: { type: ref, references: Customers, on_delete: cascade, notes: "cascade delete" }
      description: { type: text }
      height_cm: { type: decimal, size: 4 }
      inbound_advice_id: { type: ref, references: InboundAdvice, required: true, on_delete: cascade, notes: "cascade delete" }
      length_cm: { type: decimal, size: 4 }
      line_no: { type: string, size: 20 }
      qty: { type: decimal, size: 4 }
      received_qty: { type: decimal, size: 4 }
      unit: { type: string, size: 30 }
      warehouse_id: { type: ref, references: Warehouses, on_delete: set_null, notes: "set null on delete" }
      weight: { type: decimal, size: 4 }
      width_cm: { type: decimal, size: 4 }
  OutboundRequest:
    status: built
    fields:
      arrived_at: { type: datetime }
      checked_in_by: { type: string, size: 150 }
      customer_id: { type: ref, references: Customers, required: true, on_delete: cascade, notes: "cascade delete" }
      driver_id_number: { type: string, size: 60 }
      driver_name: { type: string, size: 100 }
      driver_phone: { type: string, size: 40 }
      outbound_reference: { type: string, size: 30, unique: true }
      reference_number: { type: string, size: 100 }
      requested_date: { type: date }
      status: { type: string, size: 30, required: true, default: "Submitted", notes: "default `Submitted`" }
      trailer_plate: { type: string, size: 30 }
      transporter_id: { type: ref, references: Transporters, on_delete: set_null, notes: "set null on delete" }
      vehicle_plate: { type: string, size: 30 }
      warehouse_id: { type: ref, references: Warehouses, on_delete: set_null, notes: "set null on delete" }
  PackageTypes:
    status: built
    fields:
      capacity_unit: { type: string, size: 50 }
      compatible_location_types: { type: string, size: 255 }
      name: { type: string, size: 100, required: true, unique: true }
      standard_height_cm: { type: decimal, size: 4 }
      standard_length_cm: { type: decimal, size: 4 }
      standard_weight_kg: { type: decimal, size: 4 }
      standard_width_cm: { type: decimal, size: 4 }
      status: { type: string, size: 30, required: true, default: "Active", notes: "default `Active`" }
      units_per_item: { type: decimal, size: 4, default: "1.0000", notes: "default `1.0000`" }
  PickTask:
    status: built
    fields:
      assigned_to: { type: string, size: 100 }
      cargo_id: { type: ref, references: Cargo, required: true, on_delete: cascade, notes: "cascade delete" }
      outbound_request_id: { type: ref, references: OutboundRequest, required: true, on_delete: cascade, notes: "cascade delete" }
      status: { type: string, size: 30, required: true, default: "Assigned", notes: "default `Assigned`" }
  Racks:
    status: built
    fields:
      aisle_id: { type: ref, references: Aisles, on_delete: cascade, notes: "cascade delete" }
      code: { type: string, size: 100, required: true }
  RolePermissions:
    status: built
    fields:
      function_name: { type: string, size: 100 }
      module: { type: string, size: 100, required: true }
      role: { type: string, size: 100, required: true }
      warehouse_id: { type: ref, references: Warehouses, on_delete: cascade, notes: "cascade delete" }
  ScanHistory:
    status: built
    fields:
      cargo_id: { type: ref, references: Cargo, required: true, on_delete: cascade, notes: "cascade delete" }
      scan_context: { type: string, size: 30, required: true }
      scan_timestamp: { type: datetime }
      scanned_by: { type: string, size: 100 }
  StorageLocations:
    status: built
    fields:
      bay: { type: integer }
      capacity: { type: integer }
      capacity_unit: { type: string, size: 50, default: "Pallet Positions", notes: "default `Pallet Positions`" }
      height_cm: { type: decimal, size: 4 }
      length_cm: { type: decimal, size: 4 }
      location_code: { type: string, size: 100, required: true, unique: true }
      location_type: { type: string, size: 100 }
      max_weight_kg: { type: decimal, size: 4 }
      occupancy_status: { type: string, size: 30, required: true, default: "Empty", notes: "default `Empty`" }
      rack_id: { type: ref, references: Racks, required: true, on_delete: cascade, notes: "cascade delete" }
      rack_level: { type: integer }
      width_cm: { type: decimal, size: 4 }
  Suppliers:
    status: built
    fields:
      address: { type: text }
      email: { type: string, size: 200 }
      name: { type: string, size: 200, required: true, unique: true }
      phone: { type: string, size: 50 }
      status: { type: string, size: 30, required: true, default: "Active", notes: "default `Active`" }
  Tasks:
    status: built
    fields:
      assigned_to: { type: string, size: 100 }
      due_date: { type: datetime }
      module_ref: { type: string, size: 100 }
      record_ref_id: { type: string, size: 100 }
      status: { type: string, size: 30, required: true, default: "Assigned", notes: "default `Assigned`" }
      task_priority: { type: string, size: 30 }
      task_type: { type: string, size: 100, required: true }
      warehouse_id: { type: ref, references: Warehouses, on_delete: set_null, notes: "set null on delete" }
  Transporters:
    status: built
    fields:
      contact_person: { type: string, size: 150 }
      name: { type: string, size: 200, required: true, unique: true }
      phone: { type: string, size: 40 }
      status: { type: string, size: 30, required: true, default: "Active", notes: "default `Active`" }
      vehicle_registration: { type: string, size: 40 }
  UserWarehouseRole:
    status: built
    fields:
      app_user_id: { type: ref, references: AppUsers, required: true, on_delete: cascade, notes: "cascade delete" }
      business_role: { type: string, size: 50, required: true }
      warehouse_id: { type: ref, references: Warehouses, required: true, on_delete: cascade, notes: "cascade delete" }
  VALRequest:
    status: built
    fields:
      cargo_id: { type: ref, references: Cargo, required: true, on_delete: cascade, notes: "cascade delete" }
      customer_id: { type: ref, references: Customers, required: true, on_delete: cascade, notes: "cascade delete" }
      requested_date: { type: date }
      service_type: { type: string, size: 30, required: true }
      status: { type: string, size: 30, required: true, default: "Requested", notes: "default `Requested`" }
  VALTask:
    status: built
    fields:
      assigned_to: { type: string, size: 100 }
      completion_notes: { type: text }
      status: { type: string, size: 30, required: true, default: "Assigned", notes: "default `Assigned`" }
      val_request_id: { type: ref, references: VALRequest, required: true, on_delete: cascade, notes: "cascade delete" }
  Warehouses:
    status: built
    fields:
      address: { type: text }
      name: { type: string, size: 200, required: true, unique: true }
      status: { type: string, size: 30, required: true, default: "Active", notes: "default `Active`" }
      timezone: { type: string, size: 50 }
  Zones:
    status: built
    fields:
      name: { type: string, size: 200, required: true }
      warehouse_id: { type: ref, references: Warehouses, required: true, on_delete: cascade, notes: "cascade delete" }
      zone_type: { type: string, size: 100 }
  RateCard:
    status: proposed
    fields:
      name: { type: string, required: true }
      customer_id: { type: ref, references: Customers, on_delete: restrict, notes: "empty = default card" }
      warehouse_id: { type: ref, references: Warehouses, on_delete: restrict, notes: "empty = all" }
      currency: { type: string, required: true, notes: "ISO 4217" }
      effective_from: { type: date, required: true }
      effective_to: { type: date, notes: "no overlap per customer+warehouse" }
      status: { type: string, required: true, notes: "Draft|Active|Retired" }
      notes: { type: text }
  RateCardLine:
    status: proposed
    fields:
      rate_card_id: { type: ref, references: RateCard, required: true, on_delete: cascade, notes: "cascade delete" }
      charge_type: { type: string, required: true, notes: "STORAGE|DOCK_STORAGE|RECEIVING|HU_LABEL|PUTAWAY|PICK|DISPATCH|RELOCATION|VAL_<service>|SURCHARGE_*|FIXED_FEE|MINIMUM_CHARGE" }
      basis: { type: string, required: true, notes: "PER_UNIT_DAY|PER_HU_DAY|PER_M3_DAY|PER_M2_DAY|PER_KG_DAY|PER_EVENT|PER_HU|PER_HOUR|FLAT_PERIOD" }
      unit_price: { type: decimal, required: true, notes: "4 places" }
      capacity_unit: { type: string }
      package_type_id: { type: ref, references: PackageTypes, on_delete: restrict }
      zone_type: { type: string }
      zone_id: { type: ref, references: Zones, on_delete: restrict }
      service_type: { type: string }
      condition: { type: string, notes: "predicate e.g. adr = Yes" }
      free_days: { type: integer }
      min_days: { type: integer }
      min_charge: { type: decimal, notes: "2 places" }
      zoho_item: { type: string }
      priority: { type: integer, notes: "lowest wins" }
  BillingSettings:
    status: proposed
    fields:
      warehouse_id: { type: ref, references: Warehouses, on_delete: restrict, notes: "empty = global" }
      cutoff_time: { type: string, required: true, notes: "default 23:59" }
      day_rule: { type: string, required: true, notes: "snapshot|any_presence|24h_blocks" }
      dock_free_hours: { type: integer, notes: "default 24" }
      billing_period: { type: string, required: true, notes: "monthly|weekly" }
      invoice_grouping: { type: string }
      payment_terms_days: { type: integer }
      rounding_mode: { type: string }
      approval_required: { type: boolean }
      approval_threshold: { type: decimal }
      invoice_mode: { type: string, notes: "draft|send" }
      time_zone: { type: string, required: true }
  OccupancyDay:
    status: proposed
    fields:
      date: { type: date, required: true, notes: "unique with cargo_id" }
      warehouse_id: { type: ref, references: Warehouses, required: true, on_delete: restrict }
      customer_id: { type: ref, references: Customers, required: true, on_delete: restrict }
      cargo_id: { type: ref, references: Cargo, required: true, on_delete: restrict }
      inbound_advice_id: { type: ref, references: InboundAdvice, on_delete: restrict }
      location_id: { type: ref, references: StorageLocations, on_delete: restrict }
      zone_id: { type: ref, references: Zones, on_delete: restrict }
      hu_status: { type: string }
      capacity_unit: { type: string }
      units: { type: decimal }
      weight_kg: { type: decimal }
      volume_m3: { type: decimal }
      day_number: { type: integer }
      billable: { type: boolean, required: true }
      free_reason: { type: string }
      invoice_line_id: { type: ref, references: InvoiceLine, on_delete: restrict, notes: "set when locked" }
  ChargeEvent:
    status: proposed
    fields:
      occurred_at: { type: datetime, required: true }
      warehouse_id: { type: ref, references: Warehouses, required: true, on_delete: restrict }
      customer_id: { type: ref, references: Customers, required: true, on_delete: restrict }
      charge_type: { type: string, required: true }
      quantity: { type: decimal, required: true }
      source_module: { type: string, required: true }
      source_record: { type: string, required: true }
      unit_price: { type: decimal }
      amount: { type: decimal }
      status: { type: string, required: true, notes: "Open|Disputed|Waived|Invoiced" }
      dispute_reason: { type: text }
      invoice_line_id: { type: ref, references: InvoiceLine, on_delete: restrict }
  InvoiceRun:
    status: proposed
    fields:
      period_from: { type: date, required: true }
      period_to: { type: date, required: true }
      scope: { type: text, notes: "customers/warehouses" }
      status: { type: string, required: true, notes: "Draft|In review|Approved|Pushed|Partially failed" }
      created_by: { type: string, required: true }
  InvoiceProposal:
    status: proposed
    fields:
      invoice_run_id: { type: ref, references: InvoiceRun, required: true, on_delete: cascade, notes: "cascade delete" }
      customer_id: { type: ref, references: Customers, required: true, on_delete: restrict }
      warehouse_id: { type: ref, references: Warehouses, on_delete: restrict }
      currency: { type: string, required: true }
      subtotal: { type: decimal, required: true }
      status: { type: string, required: true, notes: "Draft|Approved|Pushed|Failed|Void" }
      approved_by: { type: string }
      approved_at: { type: datetime }
      statement_file: { type: string }
      zoho_invoice_id: { type: string }
      zoho_invoice_number: { type: string }
      zoho_status: { type: string, notes: "draft|sent|viewed|unpaid|overdue|partially_paid|paid|void" }
      zoho_url: { type: string }
      pushed_at: { type: datetime }
      error_message: { type: text }
  InvoiceLine:
    status: proposed
    fields:
      invoice_proposal_id: { type: ref, references: InvoiceProposal, required: true, on_delete: cascade, notes: "cascade delete" }
      charge_type: { type: string, required: true }
      description: { type: text }
      quantity: { type: decimal, required: true }
      unit: { type: string }
      unit_price: { type: decimal, required: true }
      amount: { type: decimal, required: true }
      zoho_item_id: { type: string }
      tax_code: { type: string }
      source: { type: string, notes: "occupancy|event|adjustment" }
      period_from: { type: date }
      period_to: { type: date }
  ZohoBooksConnection:
    status: proposed
    fields:
      data_center: { type: string, required: true }
      organization_id: { type: string, required: true }
      client_id: { type: string, required: true }
      encrypted_secrets: { type: text, required: true, notes: "server-side only, never returned" }
      scopes: { type: text }
      status: { type: string, required: true, notes: "Connected|Needs re-authorisation|Error" }
      connected_by: { type: string }
      connected_at: { type: datetime }
      last_sync_at: { type: datetime }
      invoice_mode: { type: string }
  ZohoCustomerMap:
    status: proposed
    fields:
      customer_id: { type: ref, references: Customers, required: true, on_delete: cascade, notes: "cascade delete" }
      zoho_contact_id: { type: string, required: true }
      sync_status: { type: string }
      last_synced: { type: datetime }
  ZohoItemMap:
    status: proposed
    fields:
      charge_type: { type: string, required: true }
      zone_id: { type: ref, references: Zones, on_delete: restrict }
      service_type: { type: string }
      zoho_item_id: { type: string, required: true }
      zoho_tax_id: { type: string }
      name_snapshot: { type: string }
  IntegrationLog:
    status: proposed
    fields:
      occurred_at: { type: datetime, required: true }
      direction: { type: string, required: true, notes: "out|in" }
      entity: { type: string, required: true }
      record_id: { type: string }
      idempotency_key: { type: string }
      http_status: { type: integer }
      zoho_code: { type: string }
      message: { type: text }
      retry_count: { type: integer }
      status: { type: string, required: true }
  Receipt:
    status: proposed
    fields:
      inbound_advice_id: { type: ref, references: InboundAdvice, required: true, on_delete: cascade, notes: "cascade delete" }
      receipt_number: { type: string, required: true }
      arrived_at: { type: datetime, required: true }
      plate: { type: string }
      driver: { type: string }
      counted_pieces: { type: integer }
      condition_notes: { type: text }
      signature_document_id: { type: ref, references: Documents, on_delete: restrict }
      grn_id: { type: ref, references: GRN, on_delete: restrict }
  VerificationPolicy:
    status: proposed
    fields:
      warehouse_id: { type: ref, references: Warehouses, required: true, on_delete: cascade, notes: "cascade delete" }
      activity_type: { type: string, required: true }
      required: { type: boolean, required: true }
      verifier_role: { type: string }
      verifier_must_differ: { type: boolean }
  Notification:
    status: proposed
    fields:
      user_id: { type: ref, references: AppUsers, required: true, on_delete: cascade, notes: "cascade delete" }
      event_type: { type: string, required: true }
      title: { type: string, required: true }
      body: { type: text }
      record_link: { type: string }
      channel: { type: string }
      read_at: { type: datetime }
      delivery_status: { type: string }
  PushSubscription:
    status: proposed
    fields:
      user_id: { type: ref, references: AppUsers, required: true, on_delete: cascade, notes: "cascade delete" }
      endpoint: { type: text, required: true }
      keys: { type: text, required: true }
      device_label: { type: string }
  Setting:
    status: proposed
    fields:
      key: { type: string, required: true, notes: "unique" }
      value: { type: text }
  CountSession:
    status: proposed
    fields:
      warehouse_id: { type: ref, references: Warehouses, required: true, on_delete: restrict }
      location_id: { type: ref, references: StorageLocations, on_delete: restrict }
      status: { type: string, required: true }
      started_by: { type: string }
      started_at: { type: datetime }
  CountLine:
    status: proposed
    fields:
      count_session_id: { type: ref, references: CountSession, required: true, on_delete: cascade, notes: "cascade delete" }
